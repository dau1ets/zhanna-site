<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню кухни</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Arial;
    color: white;
    background: #061827;
}

body {
    min-height: 100vh;
    background: linear-gradient(rgba(6,24,39,0.6), rgba(6,24,39,0.9)),
    url("images/bg.png");
    background-size: cover;
    background-position: center;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #7de3ff;
    margin-bottom: 20px;
    font-size: 13px;
}

/* КАТЕГОРИИ */
.category {
    margin-top: 25px;
    margin-bottom: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #7de3ff;
}

/* КАРТОЧКА */
.card {
    display: flex;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 12px;
    align-items: center;
}

.card img {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
}

.info {
    flex: 1;
}

.name {
    font-weight: bold;
    font-size: 15px;
}

.desc {
    font-size: 12px;
    color: #ccc;
    margin-top: 3px;
}

.price {
    color: #7de3ff;
    font-weight: bold;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🍽 Меню кухни</h1>
<div class="subtitle">Шашлык • Бургеры • Горячее</div>

<!-- БУРГЕРЫ -->
<div class="category">🍔 Бургеры</div>

<div class="card">
    <img src="images/burger1.jpg">
    <div class="info">
        <div class="name">Чизбургер</div>
        <div class="desc">Говядина, сыр, соус</div>
    </div>
    <div class="price">1800₸</div>
</div>

<div class="card">
    <img src="images/burger2.jpg">
    <div class="info">
        <div class="name">Двойной бургер</div>
        <div class="desc">Двойная котлета, сыр</div>
    </div>
    <div class="price">2400₸</div>
</div>

<!-- ШАШЛЫК -->
<div class="category">🍖 Шашлык</div>

<div class="card">
    <img src="images/shashlyk1.jpg">
    <div class="info">
        <div class="name">Шашлык куриный</div>
        <div class="desc">Сочный куриный шашлык</div>
    </div>
    <div class="price">2500₸</div>
</div>

<div class="card">
    <img src="images/shashlyk2.jpg">
    <div class="info">
        <div class="name">Шашлык говяжий</div>
        <div class="desc">Маринованная говядина</div>
    </div>
    <div class="price">3200₸</div>
</div>

<!-- ГОРЯЧЕЕ -->
<div class="category">🍲 Горячее</div>

<div class="card">
    <img src="images/plov.jpg">
    <div class="info">
        <div class="name">Плов</div>
        <div class="desc">Рис, мясо, специи</div>
    </div>
    <div class="price">1600₸</div>
</div>

<div class="card">
    <img src="images/lagman.jpg">
    <div class="info">
        <div class="name">Лагман</div>
        <div class="desc">Домашняя лапша с мясом</div>
    </div>
    <div class="price">1500₸</div>
</div>

</div>

</body>
</html>
