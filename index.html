<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бассейн Жанна</title>

<style>

html{
  margin:0;
  padding:0;

  /* ЦЕЛЬНЫЙ ФОН */
  background:
    url("images/bg.png") center top / cover no-repeat fixed;
}

body{
  margin:0;
  padding:0;
  font-family:Arial;
  color:white;

  /* затемнение */
  background:
    linear-gradient(rgba(6,24,39,0.6), rgba(6,24,39,0.9));

  min-height:100vh;
}

.container{
  max-width:500px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
  box-sizing:border-box;
}

/* ЛОГО */
.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 15px;
  border:2px solid rgba(255,255,255,0.6);
  box-shadow:0 0 25px rgba(0,188,212,0.4);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin:10px 0;
  font-size:28px;
}

.subtitle{
  color:#bdefff;
  margin-bottom:25px;
  font-size:14px;
}

/* КНОПКИ */
.btn{
  display:block;
  margin-bottom:14px;
  padding:16px;
  border-radius:14px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  font-size:15px;
  backdrop-filter: blur(10px);
  transition:0.2s;
  box-sizing:border-box;
}

.btn:hover{
  transform:scale(1.03);
}

/* кухня */
.btn.kitchen{
  background: linear-gradient(135deg, #00bcd4, #007c91);
}

/* бар */
.btn.bar{
  background: linear-gradient(135deg, #ff7a00, #b94d00);
}

/* адрес */
.btn.map{
  background: rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
}

/* ватсап */
.btn.whatsapp{
  background: linear-gradient(135deg, #25D366, #128C7E);
}

/* тикток */
.btn.tiktok{
  background:#000000;
}

.footer{
  margin-top:30px;
  font-size:12px;
  color:#aaa;
}

</style>
</head>
