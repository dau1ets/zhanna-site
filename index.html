<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Бассейн Жанна</title>

<style>

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

/* ФОН НА ВСЮ СТРАНИЦУ */
body{
  font-family:Arial;
  color:white;

  background:
    linear-gradient(rgba(6,24,39,0.6), rgba(6,24,39,0.9)),
    url("images/bg.png");

  background-size:100% 100%;
  background-repeat:no-repeat;
  background-position:center;
  background-color:#061827;
}

.container{
  max-width:500px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
  box-sizing:border-box;
}

.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 15px;
  border:2px solid rgba(255,255,255,0.6);
  box-shadow:0 0 25px rgba(0,188,212,0.4);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin:10px 0;
  font-size:28px;
}

.subtitle{
  color:#bdefff;
  margin-bottom:25px;
  font-size:14px;
}

.btn{
  display:block;
  margin-bottom:14px;
  padding:16px;
  border-radius:14px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  font-size:15px;
  box-sizing:border-box;
}

.btn.kitchen{
  background: linear-gradient(135deg, #00bcd4, #007c91);
}

.btn.bar{
  background: linear-gradient(135deg, #ff7a00, #b94d00);
}

.btn.map{
  background: rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
}

.btn.whatsapp{
  background: linear-gradient(135deg, #25D366, #128C7E);
}

.btn.tiktok{
  background:#000;
}

.footer{
  margin-top:30px;
  font-size:12px;
  color:#aaa;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="images/logo.jpg">
</div>

<h1>Бассейн Жанна</h1>

<div class="subtitle">
Бассейн • Бар • Кухня • Кальян
</div>

<a class="btn kitchen" href="kitchen.html">
🍽 Меню кухни
</a>

<a class="btn bar" href="bar.html">
🍹 Меню бара
</a>

<a class="btn map"
href="https://2gis.kz/taraz/geo/70000001052964577">
📍 Адрес
</a>

href="https://wa.me/77776260692?text=Здравствуйте!%20Хочу%20забронировать%20место">

</a>

<a class="btn tiktok"
href="https://www.tiktok.com/@bassein.zhanna.taraz?_r=1&_t=ZS-967XVGkjIKz"
